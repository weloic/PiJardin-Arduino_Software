; PlatformIO project configuration for the PiJardin well ("puit") sensor.
; Board: Seeed Studio XIAO SAMD21 (ARM Cortex-M0+, native USB).
;
; On first build PlatformIO downloads the atmelsam platform + toolchain
; automatically -- no manual "core install" like the Arduino IDE needs.

[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino

; Matches Serial.begin(9600) in the sketch and BAUD_RATE = 9600 in PiJardin's
; read_puit.py. On the XIAO's native USB the value is nominal, but keep it in
; sync with the Pi side for the serial monitor and documentation.
monitor_speed = 9600

; NDJSON serial protocol (see README) uses ArduinoJson for safe (de)serialization.
lib_deps =
    bblanchon/ArduinoJson@^7
