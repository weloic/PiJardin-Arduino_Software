; PlatformIO project configuration for the PiJardin firmwares.
;
; This repo builds MORE THAN ONE firmware from a single src/ tree -- one per
; physical board. Each firmware lives in its own subfolder of src/ and gets its
; own environment below; build_src_filter is what keeps them apart.
;
;   src/puit/  -> [env:puit]  well water level, HC-SR04     XIAO SAMD21
;   src/pump/  -> [env:pump]  pump on/off, ZMPT101B AC      XIAO RP2040
;
; THE TWO BOARDS ARE NOT THE SAME CHIP. They are the same physical XIAO
; footprint and are indistinguishable at a glance, but the well sensor is a
; SAMD21 (Atmel, Cortex-M0+) and the pump sensor is an RP2040 (Raspberry Pi,
; dual Cortex-M0+). Different platform, different core, different bootloader.
; That is why platform/board live in each [env:] below rather than in the shared
; [env] block -- there is no longer a sensible shared default, and inheriting one
; would silently build the wrong target for whichever board was added next.
;
; Adding a board is: new src/<name>/ folder, new [env:<name>] with the matching
; filter and its own platform/board. Nothing else.
;
; NOTE: the sketches are .cpp, not .ino, and must stay that way. PlatformIO only
; converts .ino files sitting at the top level of src/, and that conversion step
; ignores build_src_filter entirely -- so .ino sources here would either be
; skipped (in a subfolder) or concatenated into one translation unit with two
; setup()/loop() pairs (at the top level). A .cpp just needs #include <Arduino.h>
; and its own function prototypes, which is all the .ino step ever added.
;
; On first build PlatformIO downloads the atmelsam platform + toolchain
; automatically -- no manual "core install" like the Arduino IDE needs.

[platformio]
; Bare `pio run` / `pio run -t upload` acts on the well sensor, preserving what
; those commands meant when this was a single-firmware project. Anything to do
; with the pump board is deliberately opt-in via `-e pump`, because an upload
; with the wrong environment selected flashes the wrong firmware onto whichever
; board happens to be plugged in. Build both at once with `-e puit -e pump`.
default_envs = puit

; --- Settings shared by every firmware ---------------------------------------
; Deliberately NOT platform or board -- see the note above.
[env]
framework = arduino

; Matches Serial.begin(9600) in the sketches and BAUD_RATE = 9600 on the Pi side
; (PiJardin's read_puit.py). On either board's native USB the value is nominal,
; but keep it in sync with the Pi side for the serial monitor and documentation.
monitor_speed = 9600

; NDJSON serial protocol (see README) uses ArduinoJson for safe (de)serialization.
lib_deps =
    bblanchon/ArduinoJson@^7

; --- Well ("puit") water level sensor -- XIAO SAMD21 -------------------------
[env:puit]
platform = atmelsam
board = seeed_xiao
build_src_filter = -<*> +<puit/>

; --- Pump on/off detection -- XIAO RP2040 ------------------------------------
; The official platformio/raspberrypi platform only ships `pico` and
; `nanorp2040connect`, and its mbed-based core does not know this board's pin
; map. maxgerhardt's fork is the standard way to get the earlephilhower
; arduino-pico core, which does: it defines A0 = GPIO26 (ADC0), ADC_RESOLUTION
; 12, and LED_BUILTIN = GPIO17. First build pulls the platform and toolchain
; from GitHub, so it needs network and takes a few minutes.
;
; UPLOAD: deliberately not the default `picotool` protocol. picotool drives the
; RP2040's PICOBOOT interface, for which Windows ships no driver, so a stock
; machine fails with "unable to connect ... may need to install a driver via
; Zadig". The bootloader's OTHER interface is plain USB mass storage -- the
; RPI-RP2 drive -- which every OS already supports. tools/flash_uf2.py copies the
; .uf2 there, resetting the board into the bootloader first when it is running.
; No driver, no Zadig, no BOOT button except on a board that will not enumerate.
[env:pump]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
board_build.core = earlephilhower
build_src_filter = -<*> +<pump/>
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/flash_uf2.py" "$BUILD_DIR/firmware.uf2"
